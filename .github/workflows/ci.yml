name: CI
# Gate-only CI for ai-teacher. Deployment is handled by deploy-prod.yml
# (ADR-0043) which triggers on successful completion of this workflow —
# the workflow name `CI` is load-bearing; deploy-prod.yml matches on it.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      # Catch build-only failures (RSC boundary errors, module-scope env reads,
      # Sentry plugin) here instead of on the production deploy. No secrets:
      # every env read in the app is lazy, and the Sentry plugin tolerates a
      # missing auth token (source-map upload is skipped, build still passes).
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
