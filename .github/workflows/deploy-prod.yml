name: deploy-prod
# Production deploy, gated on CI (ADR-0043).
#
# Runs only after the `CI` workflow completes SUCCESSFULLY on `main`. Vercel's
# git auto-deploy for `main` is disabled in vercel.json, so this workflow is the
# only path to production. PR previews are untouched (Vercel still builds every
# non-main branch).
#
# Protection rules (wait timer, required reviewer) live on the GitHub
# `production` Environment, not here.
#
# Required Environment secrets (GitHub → Settings → Environments → production):
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# Until they exist this job fails at `vercel pull` and nothing ships — which is
# the safe direction. Rollback procedure: docs/runbooks/rollback.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Manual re-deploy of main (e.g. after fixing secrets) without a new commit.
  # Only honoured when dispatched FROM main — see the job `if`.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run fires on failure too; only proceed on success (or manual).
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ai-teacher-omega-sage.vercel.app
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy exactly the commit CI validated, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g vercel@latest
      # The CLI reads VERCEL_TOKEN from the environment; never pass it as a
      # flag (it would sit in the process argv for the life of the step).
      - name: Link project + fetch production env
        run: vercel pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Deploy to production (Vercel builds it)
        id: deploy
        run: |
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          url=$(vercel deploy --prod --yes)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deployed $sha → $url"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Poll the canonical domain (the deployment-specific URL is behind Vercel
      # Authentication) but insist that the release it reports is the SHA we
      # just shipped — a stale edge serving the previous build cannot false-pass.
      - name: Smoke check
        run: |
          want="$(printf '%.7s' "${{ steps.deploy.outputs.sha }}")"
          for i in $(seq 1 12); do
            body=$(curl -fsS "https://ai-teacher-omega-sage.vercel.app/api/health" || true)
            if echo "$body" | grep -q '"ok":true'; then
              if echo "$body" | grep -q "\"release\":\"$want\""; then
                echo "healthy at release $want"; exit 0
              fi
              if echo "$body" | grep -q '"release":null'; then
                # VERCEL_GIT_COMMIT_SHA not populated for this deploy — can't
                # prove which build answered. Don't fail a good deploy over it.
                echo "::warning::/api/health is ok but reports no release SHA; cannot confirm it is $want"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "::error::/api/health did not report ok at release $want within 120s (last: $body) — roll back per docs/runbooks/rollback.md"
          exit 1
